<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Jogo do Mario · Micael Domiciano</title>
    <style>
      body { margin:0; font-family: 'Manrope', system-ui, sans-serif; background:#0f172a; color:#fff; }
      .header { padding: 18px 24px; display:flex; justify-content:space-between; align-items:center; background:#1e293b; border-bottom:1px solid #334155; }
      .header h1 { font-size: 18px; margin:0; font-weight:600; }
      .header .hint { font-size: 13px; color:#94a3b8; }
      .header a { color:#60a5fa; text-decoration:none; font-size:13px; }
      .header a:hover { text-decoration:underline; }
      .wrapper { padding: 20px; }
    </style>
</head>
<body>
    <div class="header">
      <h1>🎮 Jogo do Mario</h1>
      <div class="hint">Pressione qualquer tecla para pular · <a href="../../index.html">← Voltar ao portfólio</a></div>
    </div>
    <div class="wrapper">
      <div class="game-board">
        <div class="score">Score: 0</div>
        <img src="https://raw.githubusercontent.com/micaelsd07/Jogo-do-Mario/main/img/clouds.png" class="clouds">
        <img src="https://raw.githubusercontent.com/micaelsd07/Jogo-do-Mario/main/img/mario.gif" class="mario">
        <img src="https://raw.githubusercontent.com/micaelsd07/Jogo-do-Mario/main/img/pipe.png" class="pipe">
      </div>
    </div>
</body>
</html>
